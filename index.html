<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280" />
    <script>
      (function () {
        var sw = window.screen.width;
        var scale = sw < 1280 ? (sw / 1280).toFixed(3) : 1;
        document
          .querySelector('meta[name="viewport"]')
          .setAttribute(
            'content',
            'width=1280, initial-scale=' + scale + ', minimum-scale=0.1, maximum-scale=5, user-scalable=yes'
          );
      })();
    </script>
